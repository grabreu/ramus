[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ramus"
version = "0.1.0"
description = "Cross-platform tree/find-style CLI for exploring directory structures."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Gabriel Abreu" }]
keywords = ["cli", "tree", "find", "directory", "filesystem"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = ["typer>=0.12"]

[project.urls]
Repository = "https://github.com/grabreu/ramus"
Issues = "https://github.com/grabreu/ramus/issues"

[project.scripts]
ramus = "ramus.cli:app"

[dependency-groups]
dev = ["ruff>=0.6", "mypy>=1.11", "pytest>=8.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/ramus"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
